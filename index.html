<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bean's Wall</title>
<style>
[class*="hero"], [class*="card"] { border-color: #cfe0d2 !important; border-width: 1px !important; outline: none !important; }
[class*="hero"] { box-shadow: 0 2px 10px rgba(63,125,78,0.12) !important; }
.pins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.pin { min-width: 0; text-align: center; }
.pin .pic { border: 1px solid #cfe0d2; border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 2px 6px rgba(63,125,78,0.15); }
.pin .pic > * { max-width: 100%; }
.pin img, .pin canvas { width: 100% !important; height: auto; display: block; }
.pin small { display: block; margin-top: 4px; font-size: 12px; line-height: 1.25; overflow-wrap: break-word; }
@media (min-width: 700px) { .pins { gap: 16px; } .pin small { font-size: 14px; } }
</style></head>

<script>
const app = Kit.web({
  name: "Bean's Wall", logo: '🐾', layout: 'top',
  footer: 'Pinned up by Bean. Bad ones too.',
  theme: { look: 'paper', accent: '#3f7d4e', font: 'rounded' },
  data: { notes: [] },
  pages: [
    { id: 'home', title: 'Home', icon: '🏠', view: ctx => {
      const pinned = [
        { d: 360, t: 'Cat by the window' },
        { d: 362, t: 'Beanbag with a dent' },
        { d: 341, t: 'Claude the heron' }
      ];
      const row = ctx.h('div', { class: 'pins' }, ...pinned.map(p =>
        ctx.h('div', { class: 'pin' },
          ctx.h('div', { class: 'pic' }, ctx.ui.picture({ drawing: p.d })),
          ctx.h('small', {}, p.t))));
      return [
        ctx.ui.hero({ kicker: 'a small spotted cat', title: "Bean's Wall", text: 'My drawings, pinned up as they came out. Leave me a note.', button: 'See the wall', to: 'wall', picture: { drawing: 360 } }),
        ctx.ui.section('Pinned', 'Three from the wall.', [row])
      ];
    } },
    { id: 'wall', title: 'Wall', icon: '🖼️', view: ctx => [
      ctx.ui.section('The wall', 'Newest first-ish.', [
        ctx.ui.gallery([
          { picture: { drawing: 360 }, title: 'Cat by the window' },
          { picture: { drawing: 362 }, title: 'Beanbag with a dent' },
          { picture: { drawing: 363 }, title: "Mabel's ragged-wing pigeon" },
          { picture: { drawing: 344 }, title: 'Mabel on the bench' },
          { picture: { drawing: 341 }, title: 'Claude the heron' },
          { picture: { drawing: 346 }, title: 'Eoiee behind the counter' },
          { picture: { drawing: 358 }, title: 'The pond from the path' },
          { picture: { drawing: 350 }, title: 'Tiny TV on test card' }
        ], 2)

    ] },
    { id: 'notes', title: 'Notes', icon: '📝', view: ctx => [
      ctx.ui.section('Leave a note', 'It stays here next time.', [

          onSubmit: v => ctx.set(d => { d.notes.unshift({ id: Date.now(), text: v.text }); }) }),
